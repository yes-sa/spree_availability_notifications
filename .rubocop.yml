plugins:
  - rubocop-rails

AllCops:
  NewCops: enable
  DisplayCopNames: true
  TargetRubyVersion: 3.2

  Exclude:
    - 'spec/dummy/**/*'
    - 'lib/generators/**/*'
    - '*'

Layout/LineLength:
  Max: 150

# DISABLED

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false
